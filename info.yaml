# Tiny Tapeout project information
project:
  title:        "16x16 Combinational Array Multiplier"      
  author:       "grg"      
  discord:      "gusharov"      
  description:  "16-bit combinational array multiplier timing test"      
  language:     "Verilog" 
  clock_hz:     50000000       

  # A combinational 16x16 array multiplier costs ~1900 gates and easily fits in a 1x1 tile.
  tiles: "1x1"          

  top_module:  "tt_um_example"

  source_files:
    - "project.v"

# Because a 16x16 multiplier requires 32 input bits and 32 output bits (64 total IO), 
# it exceeds Tiny Tapeout's 24 available pins. The pinout below assumes a basic 
# shift-register wrapper in your top module to serialize the inputs and outputs.
pinout:
  # Inputs
  ui[0]: "clk"
  ui[1]: "rst_n"
  ui[2]: "shift_en"
  ui[3]: "load_en"
  ui[4]: "data_in_a"
  ui[5]: "data_in_b"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "data_out_p"
  uo[1]: "ready"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
